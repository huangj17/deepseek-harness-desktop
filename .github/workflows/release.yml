name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Check source
        working-directory: desktop
        run: npm run check
      - name: Build DMG
        working-directory: desktop
        run: npm run dist:mac
      - name: Smoke-test packaged runtime
        working-directory: desktop
        run: npm run smoke:packaged
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-macos-arm64
          path: desktop/dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Check source
        working-directory: desktop
        run: npm run check
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win
      - name: Smoke-test packaged runtime
        working-directory: desktop
        run: npm run smoke:packaged
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-windows-x64
          path: desktop/dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: deepseek-harness-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" ./* --verify-tag --generate-notes --title "DeepSeek Harness ${GITHUB_REF_NAME#v}"
