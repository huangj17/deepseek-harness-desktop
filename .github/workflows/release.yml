name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            script: dist:mac:arm64
            artifact: deepseek-harness-macos-arm64
            installer: desktop/dist/*-arm64.dmg
          - name: Intel
            runner: macos-15-intel
            script: dist:mac:x64
            artifact: deepseek-harness-macos-x64
            installer: desktop/dist/*-x64.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Check source
        working-directory: desktop
        run: npm run check
      - name: Build DMG
        working-directory: desktop
        run: npm run ${{ matrix.script }}
      - name: Smoke-test packaged runtime
        working-directory: desktop
        run: npm run smoke:packaged
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Check source
        working-directory: desktop
        run: npm run check
      - name: Build Windows installer and portable ZIP
        working-directory: desktop
        run: npm run dist:win
      - name: Smoke-test packaged runtime
        working-directory: desktop
        run: npm run smoke:packaged
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-windows-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Check source
        working-directory: desktop
        run: npm run check
      - name: Build AppImage and deb packages
        working-directory: desktop
        run: npm run dist:linux
      - name: Smoke-test packaged runtime
        working-directory: desktop
        run: npm run smoke:packaged
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-x64
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: deepseek-harness-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Build release notes
        env:
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: node desktop/scripts/release-notes.mjs "${GITHUB_REF_NAME}" > "${NOTES_PATH}"
      - name: Publish release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: gh release create "${GITHUB_REF_NAME}" ./* --verify-tag --generate-notes --notes-file "${NOTES_PATH}" --title "DeepSeek Harness Desktop ${GITHUB_REF_NAME#v}"
